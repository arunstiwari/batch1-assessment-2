spring.application.name=library-api

# ---------- Persistence (in-memory H2, recreated on every start) ----------
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# data.sql must run after Hibernate has created the tables from your entities.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Until your entities exist there are no tables for data.sql to fill, so the seed
# script is allowed to fail on start-up. Delete this line once Book and Loan are mapped.
spring.sql.init.continue-on-error=true

# ---------- JWT (read these with @Value in your token service) ----------
# HS256 needs at least 32 bytes of key material.
app.jwt.secret=${JWT_SECRET:change-me-this-demo-secret-is-at-least-32-bytes-long}
app.jwt.expiry-minutes=30

# ---------- AOP ----------
app.aop.slow-call-threshold-ms=200

# ---------- Logging ----------
# Your aspects log at DEBUG/INFO; keep this on so the evaluator can see them.
logging.level.com.fil.assessment.library=DEBUG
